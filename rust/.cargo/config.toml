[target.aarch64-linux-android]
# Fallback linker used only when CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER is
# not set. rust/build.ps1 resolves the real path from ../local.properties (sdk.dir)
# and exports that env var, which takes precedence over this value.
linker = "D:\\DevHub\\AndroidSdk\\ndk\\29.0.14206865\\toolchains\\llvm\\prebuilt\\windows-x86_64\\bin\\aarch64-linux-android33-clang.cmd"
rustflags = [
    "-Clink-arg=-Wl,-z,max-page-size=16384",
    "-Clink-arg=-Wl,-z,common-page-size=16384",
    "-Clink-arg=-Wl,-z,relro",
    "-Clink-arg=-Wl,-z,now",
    "-Clink-arg=-Wl,--enable-new-dtags",
    "-Clink-arg=-Wl,-z,separate-loadable-segments"
]